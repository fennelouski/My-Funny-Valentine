<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Funny Valentine marketing composition</title>
<style>
@font-face{font-family:ValentineDisplay;src:url('__FONT_DATA__');font-weight:100 900;font-style:normal}
*{box-sizing:border-box}html,body{margin:0}body{background:#321428;color:#ffe7ef;font-family:ValentineDisplay;caret-color:#ffcfdf}::selection{background:#ffcfdf;color:#541c3c}a{color:inherit;text-underline-offset:.18em}a:focus-visible{outline:3px solid #ffcfdf;outline-offset:5px}
.stage{position:relative;isolation:isolate;width:var(--canvas-width);height:var(--canvas-height);overflow:hidden;background:var(--background);color:var(--ink)}
.stage.coralBurgundy{--background:#f7b3c6;--ink:#4c1634;--accent:#b52c50;--pattern:#df6789}
.stage.midnightStars{--background:#161b55;--ink:#ffe5ef;--accent:#f2b4d4;--pattern:#747cd9}
.stage.mintConfetti{--background:#bceee9;--ink:#143e4c;--accent:#d33364;--pattern:#57b8b2}
.stage.plumLetter{--background:#542342;--ink:#ffe7ef;--accent:#eaa5bf;--pattern:#9c537b}
.headline{position:absolute;z-index:5;top:5%;left:6%;width:88%;margin:0;font-size:calc(var(--canvas-width)*.083);font-weight:800;font-variation-settings:'opsz' 64,'SOFT' 30,'WONK' 1;line-height:1.06;letter-spacing:-.025em;white-space:pre-line;text-wrap:balance;text-align:center}
.stage.ipad .headline{font-size:calc(var(--canvas-width)*.048);top:4.5%;white-space:normal}.stage.mac .headline{font-size:calc(var(--canvas-width)*.048);top:4.6%;white-space:normal}
.pattern{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}.pattern svg{position:absolute;width:100%;height:100%;color:var(--pattern)}
.capture{position:absolute;z-index:1;transform-origin:50% 50%;padding:6px;background:#251d29;border-radius:16px;box-shadow:0 22px 55px rgba(33,10,29,.30);line-height:0}.capture.hero{z-index:3;box-shadow:0 30px 70px rgba(33,10,29,.35)}.capture img{display:block;width:100%;height:auto;object-fit:contain}
.gallery{padding:28px;display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}.preview-tile{width:330px;margin:0}.preview-tile img{width:100%;height:auto;display:block}.preview-tile figcaption{padding:12px 0;font-size:18px;line-height:1.4}.preview-heading{font-size:38px;line-height:1.1;margin:30px 28px 0}.preview-note{font-size:18px;line-height:1.5;max-width:65ch;margin:18px 28px 0}body::-webkit-scrollbar{width:12px}body::-webkit-scrollbar-thumb{background:#9c537b;border:3px solid #321428;border-radius:8px}
</style></head><body><main id="gallery"></main><script>
const data=__GALLERY_DATA__;
function heart(x,y,s,r){return `<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><path fill="currentColor" d="M0 18C-26 1-30-17-17-24C-8-29-1-24 0-18C3-26 12-28 19-23C32-13 20 7 0 18Z"/></g>`}
function pattern(name){let shapes='';if(name==='coralBurgundy'){for(let i=0;i<12;i++)shapes+=heart((i*181+73)%1000,(i*277+139)%1400,1.0+(i%3)*.5,-18+(i%4)*12);}else if(name==='midnightStars'){for(let i=0;i<29;i++){const x=(i*127+41)%1000,y=(i*193+87)%1400;shapes+=`<path d="M${x-9} ${y}h18M${x} ${y-9}v18" fill="none" stroke="currentColor" stroke-width="3"/>`;}}else if(name==='mintConfetti'){for(let i=0;i<31;i++){const x=(i*137+67)%1000,y=(i*231+27)%1400;shapes+=`<rect x="${x}" y="${y}" width="10" height="23" rx="2" fill="currentColor" transform="rotate(${(i%7)*29} ${x} ${y})"/>`;}}else{shapes='<path d="M-180 720L460 260L1190 720L560 1310Z" fill="none" stroke="currentColor" stroke-width="28"/>';for(let i=0;i<8;i++)shapes+=heart((i*173+27)%1000,(i*237+81)%1400,.9,-12+i*3);}return `<div class="pattern" aria-hidden="true"><svg viewBox="0 0 1000 1400" preserveAspectRatio="xMidYMid slice" style="opacity:.36">${shapes}</svg></div>`}
function renderScene(scene,platform){const size=data.platforms[platform],stage=document.createElement('section');stage.className=`stage ${platform} ${scene.background}`;stage.style.setProperty('--canvas-width',size.width+'px');stage.style.setProperty('--canvas-height',size.height+'px');stage.innerHTML=pattern(scene.background);const h=document.createElement('h1');h.className='headline';h.textContent=(platform==='ipad'||platform==='mac')?scene.headline.replaceAll('\n',' '):scene.headline;stage.append(h);for(const[role,state]of Object.entries(scene.captureRoles)){const id=platform+'-'+state,source=data.captures[id],pose=scene.placements[platform][role];if(!source?.dataURL)throw Error('Matching native pixels required: '+id);const wrapper=document.createElement('div');wrapper.className='capture '+role;wrapper.dataset.capture=id;wrapper.dataset.role=role;wrapper.dataset.rotation=String(pose.angle);wrapper.style.left=pose.centerX+'%';wrapper.style.top=pose.top+'%';wrapper.style.width=pose.width+'%';wrapper.style.transform=`translateX(-50%) rotate(${pose.angle}deg)`;const image=document.createElement('img');image.src=source.dataURL;image.alt='Actual '+platform+' '+state;image.dataset.expectedWidth=source.displayedWidth;image.dataset.expectedHeight=source.displayedHeight;wrapper.append(image);stage.append(wrapper);}return stage;}
const gallery=document.getElementById('gallery');if(data.render){gallery.append(renderScene(data.scenes.find(s=>s.id===data.render.scene),data.render.platform));}else{const title=document.createElement('h1');title.className='preview-heading';title.textContent='My Funny Valentine';gallery.append(title);const note=document.createElement('p');note.className='preview-note';note.textContent='Actual composed exports. Source capture, build and review records are separate.';gallery.append(note);const rows=document.createElement('div');rows.className='gallery';for(const platform of Object.keys(data.platforms))for(const scene of data.scenes){const figure=document.createElement('figure');figure.className='preview-tile';const link=document.createElement('a');link.href=`${platform}/${String(scene.ordinal).padStart(2,'0')}-${scene.id}.png`;const image=document.createElement('img');image.src=link.href;image.alt=scene.headline.replaceAll('\n',' ');link.append(image);const caption=document.createElement('figcaption');caption.textContent=platform+' · '+scene.headline.replaceAll('\n',' ');figure.append(link,caption);rows.append(figure);}gallery.append(rows);}
</script></body></html>
